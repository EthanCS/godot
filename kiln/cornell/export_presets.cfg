[preset.0]
name="Windows Cornell validation"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/car/license.txt,assets/cornell_box/license.txt,assets/prepared/provenance.json,ASSETS.sha256"
exclude_filter="captures/*,assets/car/scene.*,assets/cornell_box/scene.*"
export_path=""
script_export_mode=2

[preset.0.options]
custom_template/release="../../bin/godot.windows.template_release.x86_64.mono.exe"
debug/export_console_wrapper=2
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
